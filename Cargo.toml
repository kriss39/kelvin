[package]
name = "kelvin"
version = "0.1.0"
edition = "2024"
description = "Indexer and history API for Rialo"
license = "Apache-2.0"
repository = "https://github.com/kriss39/kelvin"
publish = false

[dependencies]
anyhow = "1"
axum = "0.8"
bs58 = "0.5"
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "json"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[profile.release]
debug = 1
