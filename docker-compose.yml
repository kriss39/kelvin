services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kelvin
      POSTGRES_PASSWORD: kelvin
      POSTGRES_DB: kelvin
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: ["postgres", "-c", "shared_buffers=512MB", "-c", "synchronous_commit=off"]
volumes:
  pgdata:
