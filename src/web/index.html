<style>
/* Brand: ink, ice (Kelvin, indexed data) and heat (the RPC's limits, pruned data) on cool paper.
   Layout: a sticky instrument bar over one column; the home page opens with the thesis and its proof. */
:root {
  --bg: #eef2f5; --surface: #ffffff; --raised: #f6f8fa; --ink: #0e1d29; --muted: #586a78; --line: #d8e0e6;
  --ice: #0a6c8c; --ice-soft: #dcedf3; --heat: #a8501a; --heat-soft: #f7e7da;
  --ok: #1d7448; --bad: #b3261e; --hatch: #c6d1d9;
  /* Program families: one colour each, everywhere a program appears. */
  --c-system: #0b7285; --c-budget: #64748b; --c-oracle: #6741d9; --c-token: #a16207; --c-ata: #c2410c; --c-tokenomics: #2b8a3e; --c-other: #c2255c;
  /* Thermal ramp, cold to hot: activity heat and the brand accent. */
  --t1: #4c6ef5; --t2: #7048e8; --t3: #ae3ec9; --t4: #e64980; --t5: #f76707; --t6: #f59f00;
  --thermal: linear-gradient(90deg, #15aabf, #4c6ef5 22%, #7048e8 42%, #e64980 66%, #f76707 86%, #f59f00);
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 12px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0a1116; --surface: #101a21; --raised: #142029; --ink: #e3ecf2; --muted: #8b9eac; --line: #22323d;
    --ice: #52c2e0; --ice-soft: #11303b; --heat: #e59a5e; --heat-soft: #34241a;
    --ok: #50c48c; --bad: #f2756d; --hatch: #2a3a45; color-scheme: dark;
    --c-system: #3bc9db; --c-budget: #94a3b8; --c-oracle: #9775fa; --c-token: #fcc419; --c-ata: #ff922b; --c-tokenomics: #69db7c; --c-other: #f783ac;
    --t1: #5c7cfa; --t2: #845ef7; --t3: #cc5de8; --t4: #f06595; --t5: #ff922b; --t6: #fcc419;
  }
}
/* Program family chips, dots and bars */
.p-system { --pc: var(--c-system); } .p-budget { --pc: var(--c-budget); } .p-oracle { --pc: var(--c-oracle); }
.p-token { --pc: var(--c-token); } .p-ata { --pc: var(--c-ata); } .p-tokenomics { --pc: var(--c-tokenomics); } .p-other { --pc: var(--c-other); }
.tag[class*="p-"] { color: var(--pc); border-color: color-mix(in srgb, var(--pc) 40%, transparent); background: color-mix(in srgb, var(--pc) 9%, transparent); }
.chart .bar.h1b { fill: var(--t1); } .chart .bar.h2b { fill: var(--t2); } .chart .bar.h3b { fill: var(--t3); } .chart .bar.h4b { fill: var(--t4); } .chart .bar.h5b { fill: var(--t5); } .chart .bar.h6b { fill: var(--t6); }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--display); -webkit-font-smoothing: antialiased; }
a { color: var(--ice); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--ice); outline-offset: 2px; border-radius: 4px; }
.mono { font-family: var(--mono); font-size: 0.86em; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3 { margin: 0; line-height: 1.12; text-wrap: balance; }
h2 { font-size: 1.15rem; font-weight: 750; font-stretch: 110%; }
.eyebrow { font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

/* ---------- bar ---------- */
.bar::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--thermal); opacity: 0.9; }
.bar { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); }
.bar-in { max-width: 74rem; margin: 0 auto; padding: 0.65rem 1rem; display: flex; gap: 0.6rem 1rem; align-items: center; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 0.55rem; color: var(--ink); }
.brand:hover { text-decoration: none; }
.brand svg { width: 32px; height: 32px; flex: none; }
.brand b { font-size: 1.45rem; font-weight: 800; font-stretch: 125%; letter-spacing: -0.015em; }
.net { font: inherit; font-size: 0.78rem; font-weight: 600; padding: 0.25rem 0.55rem; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink); }
.search { flex: 1 1 20rem; position: relative; min-width: 0; display: flex; }
.search svg { position: absolute; left: 0.75rem; top: 50%; translate: 0 -50%; width: 16px; height: 16px; color: var(--muted); pointer-events: none; }
.search input { flex: 1; min-width: 0; font: inherit; font-size: 0.88rem; padding: 0.55rem 2.4rem 0.55rem 2.2rem; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); }
.search input::placeholder { color: var(--muted); }
.search kbd { position: absolute; right: 0.6rem; top: 50%; translate: 0 -50%; font-family: var(--mono); font-size: 0.7rem; color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 0 0.35rem; background: var(--raised); }
nav.links { display: flex; gap: 1rem; font-size: 0.88rem; font-weight: 600; }
nav.links a { color: var(--muted); }
nav.links a:hover, nav.links a[aria-current="page"] { color: var(--ink); text-decoration: none; }

main { max-width: 74rem; margin: 0 auto; padding: 1.75rem 1rem 4rem; display: grid; gap: 1.5rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); min-width: 0; }
.card > header { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem 1rem; flex-wrap: wrap; padding: 0.9rem 1.1rem; border-bottom: 1px solid var(--line); }
.card .body { padding: 1rem 1.1rem; }
.error { padding: 1rem 1.1rem; border: 1px solid var(--bad); color: var(--bad); border-radius: var(--radius); background: var(--surface); }
.note { font-size: 0.82rem; color: var(--muted); }

/* ---------- hero ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 1.5rem; align-items: stretch; }
.hero h1 { font-size: clamp(2rem, 4.6vw, 3.2rem); font-weight: 800; font-stretch: 112%; letter-spacing: -0.01em; margin: 0.4rem 0 0.9rem; }
.hero h1 em { font-style: normal; background: var(--thermal); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero p { margin: 0; max-width: 34rem; color: var(--muted); font-size: 1.02rem; }
.try { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1.2rem; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.82rem; font-weight: 600; padding: 0.35rem 0.7rem; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.chip:hover { border-color: var(--ice); text-decoration: none; }
.proof { padding: 1.25rem; display: grid; gap: 1rem; align-content: start; }
.vs { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
.vs > div { border-radius: 10px; padding: 0.85rem 1rem; display: grid; gap: 0.1rem; }
.vs .rpc { background: var(--heat-soft); }
.vs .kel { background: var(--ice-soft); }
.vs .k { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
.vs .rpc .k, .vs .rpc .v { color: var(--heat); }
.vs .kel .k, .vs .kel .v { color: var(--ice); }
.vs .v { font-size: 2.1rem; font-weight: 800; font-stretch: 110%; font-variant-numeric: tabular-nums; line-height: 1.05; }
.vs .s { font-size: 0.78rem; color: var(--muted); }
.share { height: 8px; border-radius: 4px; background: var(--ice-soft); overflow: hidden; }
.share i { display: block; height: 100%; background: var(--heat); min-width: 3px; }

/* ---------- readouts ---------- */
.readouts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.readouts > div { padding: 0.9rem 1.1rem; display: grid; gap: 0.1rem; border-left: 1px solid var(--line); }
.readouts > div:first-child { border-left: 0; }
.readouts .k { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.readouts .v { font-size: 1.4rem; font-weight: 750; font-stretch: 108%; font-variant-numeric: tabular-nums; }
.readouts .v.ice { color: var(--ice); }
.readouts .s { font-size: 0.78rem; color: var(--muted); }
.totals { display: flex; gap: 0.4rem 1.5rem; flex-wrap: wrap; padding: 0.7rem 1.1rem; border-top: 1px solid var(--line); font-size: 0.82rem; color: var(--muted); }
.totals b { color: var(--ink); font-variant-numeric: tabular-nums; }

/* ---------- ruler and chart ---------- */
.track { position: relative; height: 1.5rem; border-radius: 6px; background: var(--raised); border: 1px solid var(--line); overflow: hidden; }
.track i { position: absolute; top: 0; bottom: 0; }
.track .pruned { left: 0; background: repeating-linear-gradient(135deg, var(--hatch) 0 5px, transparent 5px 10px); }
.track .fill { background: var(--ice); min-width: 2px; }
.ticks { position: relative; height: 1.1rem; margin-top: 0.35rem; font-family: var(--mono); font-size: 0.68rem; color: var(--muted); }
.ticks span { position: absolute; white-space: nowrap; }
.legend { display: flex; flex-wrap: wrap; gap: 0.35rem 1.25rem; margin-top: 0.6rem; font-size: 0.8rem; color: var(--muted); }
.legend i { display: inline-block; width: 0.8rem; height: 0.8rem; border-radius: 2px; vertical-align: -0.12rem; margin-right: 0.35rem; }
.chart svg { display: block; width: 100%; height: 120px; }
.chart .bar { fill: var(--ice); }
.chart .bar.empty { fill: var(--line); }
.chart .axis { fill: var(--muted); font-family: var(--mono); font-size: 10px; }
.chart .grid { stroke: var(--line); stroke-width: 1; }

/* ---------- feeds ---------- */
.cols { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 1.5rem; }
.live { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.76rem; font-weight: 700; color: var(--ice); letter-spacing: 0.02em; }
.live::before { content: ""; width: 0.5rem; height: 0.5rem; border-radius: 50%; background: currentColor; }
.live.off { color: var(--muted); }
@media (prefers-reduced-motion: no-preference) {
  .live:not(.off)::before { animation: pulse 1.6s ease-in-out infinite; }
  .fresh { animation: fresh 1.2s ease-out; }
}
@keyframes pulse { 50% { opacity: 0.25; } }
@keyframes fresh { from { background: var(--ice-soft); } to { background: transparent; } }
.feed { list-style: none; margin: 0; padding: 0; max-height: 31rem; overflow-y: auto; }
.feed li[class*="p-"] { box-shadow: inset 3px 0 0 var(--pc); }
.feed li { padding: 0.65rem 1.1rem; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 0.1rem 0.75rem; align-items: start; font-size: 0.86rem; }
.feed li:last-child { border-bottom: 0; }
.feed .what { font-weight: 650; }
.feed .sub { grid-column: 2 / 4; color: var(--muted); font-size: 0.8rem; overflow-wrap: anywhere; }
.feed .r { text-align: right; color: var(--muted); font-size: 0.8rem; white-space: nowrap; }
.dot { width: 0.55rem; height: 0.55rem; border-radius: 50%; margin-top: 0.42rem; background: var(--ok); }
.dot.bad { background: var(--bad); }
.dot.blk { background: var(--ice); border-radius: 2px; }
.dot[class*="p-"] { background: var(--pc); }
.legend.heat i { width: 1.1rem; }
.readouts > div, .kpis > div { position: relative; }
.readouts > div::before, .kpis > div::before { content: ""; position: absolute; left: 1.1rem; top: 0; width: 1.6rem; height: 3px; border-radius: 0 0 3px 3px; background: var(--rc, var(--line)); }
.empty { padding: 1.25rem 1.1rem; color: var(--muted); font-size: 0.88rem; }

/* ---------- tables ---------- */
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.86rem; }
th { text-align: left; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 600; padding: 0.6rem 0.9rem; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 0.6rem 0.9rem; border-bottom: 1px solid var(--line); vertical-align: top; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: var(--raised); }
.amt { text-align: right; white-space: nowrap; font-family: var(--mono); font-size: 0.8rem; }
.in { color: var(--ok); }
.nowrap { white-space: nowrap; }
.tag { display: inline-block; font-size: 0.72rem; padding: 0.05rem 0.45rem; border-radius: 5px; background: var(--raised); border: 1px solid var(--line); margin: 0.15rem 0.25rem 0 0; white-space: nowrap; color: var(--muted); }
.tag.signer { border-color: var(--ice); color: var(--ice); background: transparent; }
.tag.quirk { border-color: var(--heat); color: var(--heat); background: var(--heat-soft); }
.tag.fine { border-color: var(--ok); color: var(--ok); background: transparent; }
.status { display: inline-flex; align-items: center; gap: 0.35rem; font-weight: 650; font-size: 0.82rem; }
.status::before { content: ""; width: 0.5rem; height: 0.5rem; border-radius: 50%; background: var(--ok); }
.status.bad { color: var(--bad); }
.status.bad::before { background: var(--bad); }
.more { display: flex; justify-content: center; padding: 0.8rem; border-top: 1px solid var(--line); }
button.btn { font: inherit; font-size: 0.85rem; font-weight: 600; padding: 0.45rem 1rem; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; cursor: pointer; }
button.btn:hover:not(:disabled) { border-color: var(--ice); }
button.btn:disabled { opacity: 0.45; cursor: default; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { font: inherit; font-size: 0.8rem; border: 0; background: transparent; color: var(--ink); padding: 0.35rem 0.75rem; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ice-soft); color: var(--ice); font-weight: 650; }

/* ---------- detail pages ---------- */
.head { display: flex; gap: 1rem; align-items: center; min-width: 0; }
.head .ident { width: 56px; height: 56px; flex: none; border-radius: 12px; overflow: hidden; }
.head .id { font-family: var(--mono); font-size: 0.95rem; overflow-wrap: anywhere; }
.head h1 { font-size: 1.7rem; font-weight: 800; font-stretch: 110%; }
.copy { font: inherit; font-size: 0.72rem; font-weight: 600; border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 5px; padding: 0.05rem 0.45rem; cursor: pointer; margin-left: 0.4rem; vertical-align: 0.1em; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 11rem), 1fr)); }
.kpis > div { padding: 0.9rem 1.1rem; display: grid; gap: 0.1rem; border-left: 1px solid var(--line); }
.kpis > div:first-child { border-left: 0; }
.kpis .k { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.kpis .v { font-size: 1.35rem; font-weight: 750; font-stretch: 108%; font-variant-numeric: tabular-nums; }
.kpis .v.ice { color: var(--ice); }
.kpis .v.heat { color: var(--heat); }
.kpis .s { font-size: 0.78rem; color: var(--muted); }
dl.kv { display: grid; grid-template-columns: minmax(8rem, max-content) minmax(0, 1fr); gap: 0.55rem 1.5rem; margin: 0; padding: 1rem 1.1rem; font-size: 0.88rem; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; overflow-wrap: anywhere; }
.ix { padding: 0.75rem 1.1rem; border-bottom: 1px solid var(--line); display: grid; gap: 0.3rem; font-size: 0.86rem; }
.ix:last-child { border-bottom: 0; }
.ix.inner { padding-left: 2.6rem; background: var(--raised); position: relative; }
.ix.inner::before { content: "↳"; position: absolute; left: 1.2rem; color: var(--muted); }
.ix .top { display: flex; flex-wrap: wrap; gap: 0.3rem 0.6rem; align-items: baseline; }
.ix .top b { font-weight: 700; }
details summary { cursor: pointer; color: var(--muted); font-size: 0.8rem; }
pre.logs { margin: 0; padding: 1rem 1.1rem; font-family: var(--mono); font-size: 0.78rem; line-height: 1.65; overflow-x: auto; white-space: pre; }
.flow { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto; gap: 0.6rem; align-items: center; padding: 0.7rem 1.1rem; border-bottom: 1px solid var(--line); font-size: 0.86rem; }
.flow:last-child { border-bottom: 0; }
.flow .arrow { color: var(--muted); }

footer.foot { max-width: 74rem; margin: 0 auto; padding: 1.5rem 1rem 2.5rem; border-top: 1px solid var(--line); font-size: 0.82rem; color: var(--muted); display: flex; gap: 0.5rem 1.5rem; flex-wrap: wrap; align-items: center; }
footer.foot .brand b { font-size: 1rem; }
footer.foot .brand svg { width: 20px; height: 20px; }

@media (max-width: 60rem) {
  .hero, .cols { grid-template-columns: 1fr; }
  .readouts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .readouts > div:nth-child(3) { border-left: 0; }
  .readouts > div:nth-child(n+3) { border-top: 1px solid var(--line); }
}
@media (max-width: 40rem) {
  nav.links { display: none; }
  .search kbd { display: none; }
  dl.kv { grid-template-columns: 1fr; gap: 0.1rem; }
  dl.kv dd { margin-bottom: 0.6rem; }
  .kpis > div { border-left: 0; border-top: 1px solid var(--line); }
  .kpis > div:first-child { border-top: 0; }
  .flow { grid-template-columns: minmax(0, 1fr) auto; }
  .flow .arrow { display: none; }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="mark" viewBox="0 0 64 64">
    <rect x="0.5" y="0.5" width="63" height="63" rx="14.5" fill="#0e1d29" stroke="#2b4152"/>
    <g stroke-linecap="round" stroke-width="3"><path d="M13 17.5h5" stroke="#ff922b"/><path d="M15 25h3" stroke="#f06595"/><path d="M13 32.5h5" stroke="#9775fa"/><path d="M15 40h3" stroke="#5c7cfa"/><path d="M13 47.5h5" stroke="#3bc9db"/></g>
    <g stroke="#fff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M24 14v36"/><path d="M47 14L24 36"/><path d="M32.5 28L48 50"/></g>
  </symbol>
</svg>
<div class="bar">
  <div class="bar-in">
    <a class="brand" href="#/" aria-label="Kelvin home"><svg aria-hidden="true"><use href="#mark"/></svg><b>kelvin</b></a>
    <select class="net" id="net" aria-label="Network"><option value="testnet">testnet</option><option value="devnet">devnet</option></select>
    <form class="search" id="search" role="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" type="search" placeholder="Search an address, transaction or block" aria-label="Search an address, transaction signature or block height" autocomplete="off" spellcheck="false">
      <kbd>/</kbd>
    </form>
    <nav class="links"><a href="#/rpc" id="nav-rpc">RPC checks</a><a href="/docs">API</a></nav>
  </div>
</div>
<main id="view" aria-live="polite"></main>
<footer class="foot">
  <a class="brand" href="#/"><svg aria-hidden="true"><use href="#mark"/></svg><b>kelvin</b></a>
  <span>Rialo history, down to the last kelvin. Amounts in RLO; 1 RLO = 10⁹ kelvin.</span>
  <a href="#/rpc">RPC checks</a><a href="/docs">API docs</a>
</footer>

<script>
(() => {
  "use strict";
  const API = (new URLSearchParams(location.search).get("api") || "").replace(/\/$/, "");
  const view = document.getElementById("view");
  const netSel = document.getElementById("net");
  const q = document.getElementById("q");
  let NET = "testnet";
  try { NET = localStorage.getItem("kelvin.net") || "testnet"; } catch (e) {}
  netSel.value = NET;
  netSel.addEventListener("change", () => { NET = netSel.value; try { localStorage.setItem("kelvin.net", NET); } catch (e) {} route(); });
  document.addEventListener("keydown", (e) => {
    if (e.key === "/" && document.activeElement !== q && !/input|textarea|select/i.test(document.activeElement.tagName)) { e.preventDefault(); q.focus(); q.select(); }
  });

  // Addresses on the home page's "try" links; descriptions match what the index shows for them.
  const EXAMPLES = [
    ["8GFLC4J4h8AGGwku4JVzeWrkdY9oeWkZNUeQfsFkNN2p", "Busiest sender"],
    ["t2J87f5HDtd4UkpszzBCm6nfbRgkJHRrbJtxuWpwVAG", "Oracle reporter"],
  ];

  // ---------- formatting ----------
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmt = (n) => (n == null ? "–" : Number(n).toLocaleString("en-US"));
  const approx = (n) => (n == null ? "–" : n >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 1 : 2) + "M" : n >= 1e4 ? Math.round(n / 1e3) + "k" : fmt(n));
  const short = (s, a = 6, b = 6) => (s && s.length > a + b + 1 ? s.slice(0, a) + "…" + s.slice(-b) : s || "");
  const rlo = (kelvin) => {
    const k = BigInt(kelvin), neg = k < 0n, a = neg ? -k : k;
    const w = a / 1000000000n, f = (a % 1000000000n).toString().padStart(9, "0").replace(/0+$/, "");
    return (neg ? "−" : "") + w.toLocaleString("en-US") + (f ? "." + f : "");
  };
  const ago = (ms) => {
    const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
    return s < 60 ? s + "s ago" : s < 3600 ? Math.floor(s / 60) + "m ago" : s < 86400 ? Math.floor(s / 3600) + "h ago" : Math.floor(s / 86400) + "d ago";
  };
  const when = (iso) => iso.replace("T", " ").replace("Z", "");
  const addr = (a, label) => `<a class="mono" href="#/address/${esc(a)}" title="${esc(a)}">${esc(label || short(a))}</a>`;
  const txLink = (s) => `<a class="mono nowrap" href="#/tx/${esc(s)}" title="${esc(s)}">${esc(short(s, 6, 4))}</a>`;
  const blockLink = (h) => `<a class="num" href="#/block/${h}">${fmt(h)}</a>`;
  const statusTag = (s) => `<span class="status ${s === "failed" ? "bad" : ""}">${s === "failed" ? "Failed" : "Success"}</span>`;
  const copyBtn = (text) => `<button class="copy" type="button" data-copy="${esc(text)}">Copy</button>`;
  const amount = (t) => (t.mint ? `${fmt(t.amount)} <span class="muted" title="Mint ${esc(t.mint)}">${esc(short(t.mint, 4, 4))}</span>` : `${rlo(t.amount)} RLO`);
  document.addEventListener("click", (e) => {
    const b = e.target.closest(".copy");
    if (!b) return;
    navigator.clipboard?.writeText(b.dataset.copy).then(() => { b.textContent = "Copied"; setTimeout(() => (b.textContent = "Copy"), 1200); }, () => {});
  });

  // What a transaction does, in words: its first instruction that is not a compute-budget setting.
  const LABELS = {
    "System:transfer": "Transfer", "System:create_account": "Create account", "System:assign": "Assign account",
    "OracleProcessor:report": "Oracle report", "OracleRegistry:create": "Oracle registration",
    "Token2022:transfer_checked": "Token transfer", "Token2022:mint_to": "Token mint", "Token2022:burn": "Token burn",
    "AssociatedToken:create_idempotent": "Create token account", "AssociatedToken:create": "Create token account",
    "TokenomicsGovernance:null": "Tokenomics",
  };
  const FAMILY = { System: "p-system", ComputeBudget: "p-budget", OracleProcessor: "p-oracle", OracleRegistry: "p-oracle", Token2022: "p-token", Token: "p-token", AssociatedToken: "p-ata", TokenomicsGovernance: "p-tokenomics" };
  const family = (i) => (i ? FAMILY[i.program_name] || "p-other" : "p-other");
  const mainIx = (t) => t.instructions.find((i) => i.program_name !== "ComputeBudget") || t.instructions[0];
  const heat = (n) => (n <= 0 ? "" : n === 1 ? "h1b" : n === 2 ? "h2b" : n === 3 ? "h3b" : n <= 5 ? "h4b" : n <= 8 ? "h5b" : "h6b");
  const human = (k) => k.replace(/_/g, " ").replace(/^./, (c) => c.toUpperCase());
  function headline(t) {
    const main = t.instructions.find((i) => i.program_name !== "ComputeBudget") || t.instructions[0];
    if (!main) return "Transaction";
    const label = LABELS[`${main.program_name}:${main.kind}`] || (main.kind ? human(main.kind) : "Program call");
    return label + (main.program_name || main.kind ? "" : ` · ${short(main.program, 4, 4)}`);
  }
  // The RPC's error object, as a short reason: {"InsufficientFundsForRent":…} or {"InstructionError":[2,{"Custom":1}]}.
  const reason = (e) => {
    if (!e || typeof e !== "object") return e ? String(e) : "";
    const k = Object.keys(e)[0];
    if (k === "InstructionError" && Array.isArray(e[k])) {
      const inner = e[k][1];
      const what = typeof inner === "object" ? `${Object.keys(inner)[0]} ${JSON.stringify(Object.values(inner)[0])}` : String(inner);
      return `Instruction ${e[k][0]}: ${what}`;
    }
    return human(k.replace(/([a-z])([A-Z])/g, "$1 $2").toLowerCase());
  };
  const detailTags = (t) => {
    const seen = new Set();
    return t.instructions.filter((i) => i.program_name !== "ComputeBudget").map((i) => {
      const l = (i.kind ? human(i.kind) : "Call") + " · " + (i.program_name || short(i.program, 4, 4));
      if (seen.has(l)) return "";
      seen.add(l);
      return `<span class="tag ${family(i)}">${esc(l)}</span>`;
    }).join("");
  };

  // Deterministic five-by-five, mirrored pattern from the address string.
  function identicon(a) {
    let h = 2166136261;
    for (const c of a) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; }
    const hue = h % 360;
    let bits = Math.imul(h ^ 0x9e3779b9, 2654435761) >>> 0;
    let cells = "";
    for (let y = 0; y < 5; y++) for (let x = 0; x < 3; x++) {
      if (bits & 1) { cells += `<rect x="${x}" y="${y}" width="1" height="1"/>`; if (x < 2) cells += `<rect x="${4 - x}" y="${y}" width="1" height="1"/>`; }
      bits >>>= 1;
    }
    return `<svg class="ident" viewBox="-1 -1 7 7" aria-hidden="true"><rect x="-1" y="-1" width="7" height="7" fill="hsl(${hue} 40% 90%)"/><g fill="hsl(${hue} 55% 34%)">${cells}</g></svg>`;
  }

  async function api(path) {
    const r = await fetch(`${API}/v1/${NET}${path}`);
    let body = null;
    try { body = await r.json(); } catch (e) {}
    if (!r.ok) throw new Error((body && body.error) || `${r.status} ${r.statusText}`);
    return body;
  }

  // Timers and streams a page opens are closed when the route changes.
  let cleanups = [];
  const onLeave = (fn) => cleanups.push(fn);
  const leave = () => { cleanups.forEach((f) => { try { f(); } catch (e) {} }); cleanups = []; };
  function stream(params, handlers, badges) {
    const es = new EventSource(`${API}/v1/${NET}/stream${params}`);
    const set = (on) => badges.forEach((b) => { b.classList.toggle("off", !on); b.textContent = on ? "Live" : "Reconnecting…"; });
    es.onopen = () => set(true);
    es.onerror = () => set(false);
    for (const [name, fn] of Object.entries(handlers)) es.addEventListener(name, (e) => fn(JSON.parse(e.data)));
    onLeave(() => es.close());
  }
  function ticking() {
    const t = setInterval(() => document.querySelectorAll("[data-ms]").forEach((el) => (el.textContent = ago(+el.dataset.ms))), 1000);
    onLeave(() => clearInterval(t));
  }
  const showError = (e) => { view.innerHTML = `<div class="error">${esc(e.message || e)}</div>`; };

  document.getElementById("search").addEventListener("submit", (e) => {
    e.preventDefault();
    const v = q.value.trim();
    if (!v) return;
    if (/^\d+$/.test(v)) location.hash = `#/block/${v}`;
    else if (/^[1-9A-HJ-NP-Za-km-z]{80,90}$/.test(v)) location.hash = `#/tx/${v}`;
    else if (/^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(v)) location.hash = `#/address/${v}`;
    else showError("That is not an address, a transaction signature or a block height.");
  });

  // ---------- home ----------
  async function home() {
    view.innerHTML = `
      <section class="hero">
        <div>
          <span class="eyebrow">Rialo ${esc(NET)} · indexed live</span>
          <h1>Rialo history, down to the <em>last kelvin</em>.</h1>
          <p>The Rialo RPC answers with the newest 20 transactions of an address and serves no blocks older than 17 September. Kelvin indexes every block, so the whole history of any address is one query away.</p>
          <div class="try"><span class="note">Try</span>${EXAMPLES.map(([a, l]) => `<a class="chip" href="#/address/${a}">${esc(l)}</a>`).join("")}<a class="chip" href="#/rpc">What the RPC gets wrong</a></div>
        </div>
        <div class="card proof" id="proof"><span class="eyebrow">One address, two answers</span><div class="note">Loading…</div></div>
      </section>
      <section class="card">
        <div class="readouts" id="readouts"><div><span class="k">Loading</span><span class="v">…</span></div></div>
        <div class="totals" id="totals"></div>
      </section>
      <section class="card">
        <header><h2>Block heights</h2><span class="note" id="rulernote"></span></header>

      </section>
      <section class="card chart">
        <header><h2>User transactions per block</h2><span class="note" id="chartnote">last 100 blocks</span></header>
        <div class="body"><svg id="chart" viewBox="0 0 1000 120" preserveAspectRatio="none" role="img" aria-label="User transactions in each of the latest blocks"></svg>
          <div class="legend heat"><span>Colder</span><span><i class="hb" style="background:var(--t1)"></i>1</span><span><i style="background:var(--t2)"></i>2</span><span><i style="background:var(--t3)"></i>3</span><span><i style="background:var(--t4)"></i>4–5</span><span><i style="background:var(--t5)"></i>6–8</span><span><i style="background:var(--t6)"></i>9+</span><span>hotter: user transactions per block</span></div></div>
      </section>
      <section class="cols">

        <div class="card"><header><h2>Blocks with activity</h2><span class="live off" id="live2">Connecting…</span></header><ul class="feed" id="blocks"></ul></div>
      </section>`;

    const refresh = async () => {
      try { renderStatus(await api("/status")); }
      catch (e) { const el = document.getElementById("readouts"); if (el) el.innerHTML = `<div><span class="k">Status</span><span class="s">${esc(e.message)}</span></div>`; }
    };
    refresh();
    const t = setInterval(refresh, 5000);
    onLeave(() => clearInterval(t));
    proof();

    const txsEl = document.getElementById("txs"), blocksEl = document.getElementById("blocks");
    const txRow = (t, fresh) => {
      const x = t.transfers[0];
      const sub = t.status === "failed" ? `<span class="status bad">${esc(reason(t.error))}</span>` : x ? `${addr(x.from)} → ${addr(x.to)}` : detailTags(t);
      const fam = family(mainIx(t));
      return `<li class="${fam} ${fresh ? "fresh" : ""}"><span class="dot ${fam}" title="${esc(mainIx(t)?.program_name || "program")}"></span>
        <span><span class="what">${esc(headline(t))}</span>${x ? ` <span class="mono">${amount(x)}</span>` : ""}</span>
        <span class="r"><span data-ms="${t.time_ms}">${ago(t.time_ms)}</span><br>${txLink(t.signature)}</span>
        <span class="sub">${sub}</span></li>`;
    };
    const blockRow = (b, fresh) => {
      const n = b.transaction_count - b.system_transaction_count;
      return `<li class="${fresh ? "fresh" : ""}"><span class="dot blk"></span><span>${blockLink(b.height)} <span class="muted">· ${n} user tx${n === 1 ? "" : "s"}</span></span><span class="r" data-ms="${b.time_ms}">${ago(b.time_ms)}</span></li>`;
    };
    const prepend = (el, html, max) => {
      el.querySelector(".empty")?.remove();
      el.insertAdjacentHTML("afterbegin", html);
      while (el.children.length > max) el.lastElementChild.remove();
    };
    const bars = [];
    const drawChart = () => {
      const svg = document.getElementById("chart");
      if (!svg) return;
      const n = 100, w = 1000 / n, max = Math.max(4, ...bars.map((b) => b.n));
      const shown = bars.slice(-n);
      svg.innerHTML = [0.5, 1].map((f) => `<line class="grid" x1="0" x2="1000" y1="${110 - 100 * f}" y2="${110 - 100 * f}"/>`).join("") +
        shown.map((b, i) => {
          const h = Math.max(2, (b.n / max) * 100);
          return `<rect class="bar ${b.n ? heat(b.n) : "empty"}" x="${(n - shown.length + i) * w + 1}" y="${110 - h}" width="${w - 2}" height="${h}"><title>Block ${fmt(b.h)}: ${b.n} user tx</title></rect>`;
        }).join("") + `<text class="axis" x="4" y="${110 - 100 + 10}">${max}</text>`;
      const total = shown.reduce((s, b) => s + b.n, 0);
      document.getElementById("chartnote").textContent = `last ${shown.length} blocks · ${(total / Math.max(1, shown.length)).toFixed(2)} per block · busiest ${Math.max(0, ...shown.map((b) => b.n))}`;
    };
    try {
      const recent = await api("/blocks?limit=100");
      recent.items.slice().reverse().forEach((b) => bars.push({ h: b.height, n: b.transaction_count - b.system_transaction_count }));
      drawChart();
      const busy = recent.items.filter((b) => b.transaction_count > b.system_transaction_count);
      blocksEl.innerHTML = busy.slice(0, 15).map((b) => blockRow(b, false)).join("") || `<li class="empty">No user transactions in the last 100 blocks.</li>`;
      const blocks = await Promise.all(busy.slice(0, 5).map((b) => api(`/blocks/${b.height}`)));
      const txs = blocks.flatMap((b) => b.transactions);
      if (txs.length) txsEl.innerHTML = txs.slice(0, 15).map((t) => txRow(t, false)).join("");
    } catch (e) { blocksEl.innerHTML = `<li class="empty">${esc(e.message)}</li>`; }
    stream("", {
      block: (b) => {
        bars.push({ h: b.height, n: b.transaction_count - b.system_transaction_count });
        if (bars.length > 300) bars.splice(0, bars.length - 100);
        drawChart();
        if (b.transaction_count > b.system_transaction_count) prepend(blocksEl, blockRow(b, true), 30);
      },
      tx: (t) => prepend(txsEl, txRow(t, true), 30),
    }, [document.getElementById("live1"), document.getElementById("live2")]);
    ticking();
  }

  async function proof() {
    const [a, label] = EXAMPLES[0];
    const el = document.getElementById("proof");
    try {
      const s = await api(`/address/${a}`);
      const share = Math.min(100, (20 / Math.max(20, s.transaction_count)) * 100);
      el.innerHTML = `
        <span class="eyebrow">One address, two answers</span>
        <div><a class="mono" href="#/address/${a}">${esc(short(a, 8, 8))}</a> <span class="note">· ${esc(label.toLowerCase())}</span></div>

          <div class="rpc"><span class="k">Rialo RPC</span><span class="v">20</span><span class="s">newest only; limit and before are ignored</span></div>
          <div class="kel"><span class="k">Kelvin</span><span class="v">${approx(s.transaction_count)}</span><span class="s">since ${s.first_seen ? when(s.first_seen.time).slice(0, 10) : "–"}, and counting</span></div>
        </div>
        <div><div class="share"><i style="width:${share}%"></i></div><div class="note" style="margin-top:0.35rem">The RPC shows ${share < 0.1 ? "less than 0.1" : share.toFixed(1)}% of this address's history.</div></div>`;
    } catch (e) { el.innerHTML = `<span class="eyebrow">One address, two answers</span><div class="note">${esc(e.message)}</div>`; }
  }

  function renderStatus(s) {
    const el = document.getElementById("readouts");
    if (!el) return;
    if (!s.indexing) { el.innerHTML = `<div><span class="k">${esc(s.network)}</span><span class="v">Not indexed yet</span></div>`; return; }
    const lagSec = Math.max(0, s.lag_blocks || 0) / 7;
    el.innerHTML = `
      <div style="--rc:var(--c-system)"><span class="k">Indexed tip</span><span class="v ice">${fmt(s.indexed_tip)}</span><span class="s">${fmt(s.lag_blocks)} blocks · about ${lagSec.toFixed(1)} s behind</span></div>
      <div style="--rc:var(--c-budget)"><span class="k">Chain head</span><span class="v">${fmt(s.head)}</span><span class="s">reported by the Rialo RPC</span></div>
      <div style="--rc:var(--t2)"><span class="k">History backfill</span><span class="v">${(s.backfill.progress * 100).toFixed(1)}%</span><span class="s">${s.backfill.complete ? "complete" : "at block " + fmt(s.backfill.next)}</span></div>
      <div style="--rc:${s.missing_blocks ? "var(--bad)" : "var(--ok)"}"><span class="k">Missing blocks</span><span class="v">${fmt(s.missing_blocks)}</span><span class="s">heights Kelvin could not fetch</span></div>`;
    const t = s.totals || {};
    document.getElementById("totals").innerHTML =
      `<span>Indexed so far: <b>${approx(t.blocks)}</b> blocks</span><span><b>${approx(t.transactions)}</b> user transactions</span><span><b>${approx(t.addresses)}</b> addresses</span><span><b>${approx(t.transfers)}</b> transfers</span>`;
    const oldest = s.oldest_block_served_by_rpc ?? s.backfill.from;
    const lo = Math.max(0, s.backfill.from - (s.head - s.backfill.from) * 0.08), span = s.head - lo;
    const x = (h) => ((h - lo) / span) * 100;
    const tipFrom = (s.backfill.until ?? s.indexed_tip) + 1;
    document.getElementById("track").innerHTML =
      `<i class="pruned" style="width:${x(oldest)}%"></i>` +
      `<i class="fill" style="left:${x(s.backfill.from)}%;width:${x(Math.min(s.backfill.next, tipFrom)) - x(s.backfill.from)}%"></i>` +
      `<i class="fill" style="left:${x(tipFrom)}%;width:${x(s.indexed_tip + 1) - x(tipFrom)}%"></i>`;
    document.getElementById("ticks").innerHTML =
      `<span style="left:${x(oldest)}%;translate:-50% 0">${(oldest / 1e6).toFixed(2)}M</span><span style="right:0">${(s.head / 1e6).toFixed(2)}M head</span>`;
    document.getElementById("rulernote").textContent = `The RPC serves ${fmt(s.head - oldest + 1)} blocks; everything below ${fmt(oldest)} is gone`;
  }

  // ---------- RPC checks ----------

          <div class="seg" id="tab"><button type="button" data-t="txs" aria-pressed="true">Transactions</button><button type="button" data-t="transfers" aria-pressed="false">Transfers</button></div>
          <div style="display:flex;gap:0.75rem;align-items:center;flex-wrap:wrap">
            <div class="seg" id="order"><button type="button" data-o="desc" aria-pressed="true">Newest</button><button type="button" data-o="asc" aria-pressed="false">Oldest</button></div>
            <span class="live off" id="live">Connecting…</span>
          </div>
        </header>
        <div class="tablewrap"><table><thead id="thead"></thead><tbody id="rows"></tbody></table></div>
        <div class="more"><button class="btn" type="button" id="more">Load more</button></div>
      </section>`;
    let tab = "txs", order = "desc", cursor = null, loading = false;
    const rows = document.getElementById("rows"), more = document.getElementById("more");
    const head = () => {
      document.getElementById("thead").innerHTML = tab === "txs"
        ? `<tr><th>When</th><th>What</th><th>Transaction</th><th>Block</th><th class="amt">RLO</th><th>Status</th></tr>`
        : `<tr><th>When</th><th></th><th>Counterparty</th><th>Transaction</th><th class="amt">Amount</th></tr>`;
    };
    const net = (t) => t.transfers.filter((x) => !x.mint).reduce((sum, x) => sum + (x.to === a ? BigInt(x.amount) : 0n) - (x.from === a ? BigInt(x.amount) : 0n), 0n);
    const timeCell = (t) => `<td class="nowrap"><span data-ms="${t.time_ms}" title="${when(t.time)} UTC">${ago(t.time_ms)}</span></td>`;
    const txRow = (t, fresh) => {
      const n = net(t);
      const amt = n === 0n ? "" : `<span class="${n > 0n ? "in" : ""}">${n > 0n ? "+" : ""}${rlo(n.toString())}</span>`;
      return `<tr class="${fresh ? "fresh" : ""}">${timeCell(t)}<td><b>${esc(headline(t))}</b>${t.role?.signer ? ` <span class="tag signer">signer</span>` : ""}<div>${detailTags(t)}</div></td><td>${txLink(t.signature)}</td><td>${blockLink(t.block)}</td><td class="amt">${amt}</td><td>${statusTag(t.status)}</td></tr>`;
    };
    const trRow = (t) => {
      const other = t.direction === "out" ? t.to : t.from;
      return `<tr>${timeCell(t)}<td>${t.direction === "out" ? "to" : `<span class="in">from</span>`}</td><td>${addr(other)}</td><td>${txLink(t.signature)}</td><td class="amt ${t.direction === "in" ? "in" : ""}">${t.direction === "out" ? "−" : "+"}${amount(t)}</td></tr>`;
    };
    async function load(reset) {
      if (loading) return;
      loading = true; more.disabled = true;
      if (reset) { cursor = null; head(); rows.innerHTML = `<tr><td colspan="6" class="empty">Loading…</td></tr>`; }
      try {
        const page = await api(`/address/${a}/${tab}?limit=50&order=${order}${cursor ? "&cursor=" + encodeURIComponent(cursor) : ""}`);
        if (reset) rows.innerHTML = "";
        rows.insertAdjacentHTML("beforeend", page.items.map((t) => (tab === "txs" ? txRow(t, false) : trRow(t))).join(""));
        if (!rows.children.length) rows.innerHTML = `<tr><td colspan="6" class="empty">Nothing indexed for this address yet.</td></tr>`;
        cursor = page.next_cursor;
        more.textContent = cursor ? "Load more" : "Start of history reached";
        if (order === "desc" && !cursor) more.textContent = "Oldest indexed transaction reached";
        if (order === "asc" && !cursor) more.textContent = "Newest transaction reached";
        more.disabled = !cursor;
      } catch (e) { rows.innerHTML = `<tr><td colspan="6"><div class="error">${esc(e.message)}</div></td></tr>`; }
      loading = false;
    }
    more.addEventListener("click", () => load(false));
    const group = (id, key, set) => document.getElementById(id).addEventListener("click", (e) => {
      const b = e.target.closest("button");
      if (!b) return;
      document.querySelectorAll(`#${id} button`).forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      set(b.dataset[key]);
      load(true);
    });
    group("tab", "t", (v) => (tab = v));
    group("order", "o", (v) => (order = v));
    load(true);
    stream(`?address=${encodeURIComponent(a)}`, {
      tx: (t) => { if (tab === "txs" && order === "desc") { rows.querySelector(".empty")?.closest("tr")?.remove(); rows.insertAdjacentHTML("afterbegin", txRow(t, true)); } },
    }, [document.getElementById("live")]);
    ticking();
  }

  // ---------- transaction ----------
  async function tx(sig) {
    view.innerHTML = `<div class="note">Loading transaction…</div>`;
    let t;
    try { t = await api(`/tx/${sig}`); } catch (e) { return showError(e); }
    const summary = { instructions: t.instructions.filter((i) => i.inner_index == null), transfers: t.transfers };
    const accounts = t.accounts.map((x) => `<tr><td>${addr(x.address, x.address)}</td><td class="nowrap">${x.signer ? `<span class="tag signer">signer</span>` : ""}<span class="tag">${x.writable ? "writable" : "read-only"}</span></td></tr>`).join("");
    const ixs = t.instructions.map((i) => `
      <div class="ix ${family(i)} ${i.inner_index != null ? "inner" : ""}" style="box-shadow: inset 3px 0 0 var(--pc)">
        <div class="top"><span class="mono muted">#${i.index}${i.inner_index != null ? "." + i.inner_index : ""}</span><b>${esc(i.kind ? human(i.kind) : "Not decoded")}</b><span class="tag ${family(i)}">${esc(i.program_name || "Program")}</span>${addr(i.program, short(i.program, 4, 4))}</div>
        ${i.accounts.length ? `<div class="note">Accounts: ${i.accounts.map((x) => addr(x, short(x, 4, 4))).join(", ")}</div>` : ""}
        ${i.data ? `<details><summary>Raw data · ${i.data.length} base58 characters</summary><div class="mono" style="overflow-wrap:anywhere;margin-top:0.3rem">${esc(i.data)}</div></details>` : ""}
      </div>`).join("");
    const flows = t.transfers.length
      ? t.transfers.map((x) => `<div class="flow"><span>${addr(x.from)}</span><span class="arrow">→</span><span>${addr(x.to)}</span><span class="amt">${amount(x)}</span></div>`).join("")
      : `<div class="empty">No RLO or tokens moved.</div>`;
    view.innerHTML = `
      <section class="head"><div style="min-width:0"><span class="eyebrow">Transaction · ${statusTag(t.status)}</span><h1>${esc(headline(summary))}</h1><div class="id">${esc(sig)}${copyBtn(sig)}</div></div></section>
      <section class="card"><dl class="kv">
        <dt>Time</dt><dd>${when(t.time)} UTC <span class="muted">· ${ago(t.time_ms)}</span> <span class="note">(the RPC's getTransaction returns no time)</span></dd>
        <dt>Block</dt><dd>${blockLink(t.block)} <span class="muted">· position ${t.index}</span></dd>
        <dt>Fee payer</dt><dd>${addr(t.fee_payer, t.fee_payer)}</dd>
        <dt>Fee</dt><dd>${rlo(t.fee)} RLO <span class="muted">· ${fmt(t.fee)} kelvin</span></dd>
        <dt>Compute units</dt><dd>${t.compute_units != null ? fmt(t.compute_units) : "–"}</dd>
        ${t.error ? `<dt>Error</dt><dd class="mono">${esc(JSON.stringify(t.error))}</dd>` : ""}
      </dl></section>
      <section class="card"><header><h2>Value moved</h2></header>${flows}</section>
      <section class="card"><header><h2>Instructions</h2><span class="note">${t.instructions.length} including inner</span></header>${ixs}</section>
      <section class="card"><header><h2>Accounts</h2></header><div class="tablewrap"><table>${accounts}</table></div></section>
      ${t.logs ? `<section class="card"><details><summary style="padding:0.9rem 1.1rem">Program logs · ${t.logs.length} lines</summary><pre class="logs">${esc(t.logs.join("\n"))}</pre></details></section>` : ""}`;
  }

  // ---------- block ----------
  async function block(h) {
    view.innerHTML = `<div class="note">Loading block…</div>`;
    let b;
    try { b = await api(`/blocks/${h}`); } catch (e) { return showError(e); }
    const rows = b.transactions.map((t) => `<tr><td><b>${esc(headline(t))}</b><div>${detailTags(t)}</div></td><td>${txLink(t.signature)}</td><td class="amt">${t.transfers.length ? amount(t.transfers[0]) + (t.transfers.length > 1 ? ` <span class="muted">+${t.transfers.length - 1}</span>` : "") : ""}</td><td>${statusTag(t.status)}</td></tr>`).join("");
    view.innerHTML = `
      <section class="head"><div><span class="eyebrow">Block</span><h1 class="num">${fmt(b.height)}</h1></div></section>
      <section class="card"><dl class="kv">
        <dt>Time</dt><dd>${when(b.time)} UTC <span class="muted">· ${ago(b.time_ms)}</span></dd>
        <dt>Transactions</dt><dd>${b.transaction_count} <span class="muted">· ${b.system_transaction_count} system (counted, not listed)</span></dd>
        <dt>Neighbours</dt><dd><a href="#/block/${b.height - 1}">← ${fmt(b.height - 1)}</a> · <a href="#/block/${b.height + 1}">${fmt(b.height + 1)} →</a></dd>
      </dl></section>
      <section class="card"><header><h2>User transactions</h2></header>
        <div class="tablewrap"><table><thead><tr><th>What</th><th>Transaction</th><th class="amt">Moved</th><th>Status</th></tr></thead>
        <tbody>${rows || `<tr><td colspan="4" class="empty">Only system transactions in this block.</td></tr>`}</tbody></table></div></section>`;
  }

  // ---------- routing ----------
  function route() {
    leave();
    window.scrollTo(0, 0);
    const [, page, arg] = location.hash.split("/");
    document.getElementById("nav-rpc").toggleAttribute("aria-current", page === "rpc");
    if (page === "address" && arg) { q.value = arg; address(arg); }
    else if (page === "tx" && arg) { q.value = arg; tx(arg); }
    else if (page === "block" && /^\d+$/.test(arg || "")) { q.value = arg; block(arg); }
    else if (page === "rpc") { q.value = ""; rpcPage(); }
    else { q.value = ""; home(); }
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
